{% extends 'amazon/base.html' %}

    {% block content%}
    <div class="container-fluid">
        <div class="row d-flex justify-content-center mt-5">
            <div class="col-4">
                <h3>Login</h3>
                <div class="">
                    {% include 'amazon/includes/error.html' %}
                    <div class="col-12">
                        <span class="fw-bold"></span>
                        <span class="text-danger"></span>
                    </div>
                </div>
    
                <div class="col-12">
                    <span class="text-danger"></span>
                </div>
    
                <div class="container mt-3">
                    <div class="d-flex justify-content-center">
                        <div class="alert alert-success alert-dismissible fade show" role="alert"> 
                            Message <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    </div>
                </div>
        
                <div class="my-3">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" value="{{username}}">
                        </div>
                       
                        <div class="form-group">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" value="{{form.password.value|default:""}}">
                        </div>
                       
                        <div class="my-3 d-flex justify-content-between">
                            <a href="{% url 'amazon:forgotpassword' %}">Forgot Password</a>
                            <button type="submit" class="btn btn-primary">Login</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="bg-dark text-light p-3 fixed-bottom">
        <div class="col-4 d-flex justify-content-center align-items-center">
          <span class="text-light">© 2021 Company, Inc</span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
{% endblock %}
